openapi: 3.1.0
info:
  title: Rafii Control v2 Intelligence API
  version: 2.0.0-design
  description: Proposed initial intelligence contract. Not deployed. Existing support,
    billing and user lifecycle endpoints require scoped adapters and are specified
    in the master document; this file does not claim to implement all product routes.
servers:
- url: /api/control/v2
  description: Same-origin control BFF; not the customer application host.
security:
- FounderSession: []
paths:
  /session:
    get:
      operationId: sessionRead
      summary: Read current founder session and capabilities
      x-required-capability: control.read
      responses:
        '200':
          description: Returned with safe schema and current evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeProjection'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Operator/capability/scope denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Bounded query/operation rate exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Source or execution unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /overview:
