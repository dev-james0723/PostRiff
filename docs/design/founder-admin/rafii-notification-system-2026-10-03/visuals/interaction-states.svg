<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#f5f5f2"/>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#161616}.m{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666}.panel{fill:#fff;stroke:#d8d8d3;stroke-width:2}.card{fill:#fff;stroke:#d2d2cd;stroke-width:2}.soft{fill:#f0f0ec}.dark{fill:#181818}</style>
<text class="t" x="70" y="70" font-size="34" font-weight="700">Rafii Notification System — interaction states</text>
<text class="m" x="70" y="108" font-size="20">Original implementation reference • 2026-10-03</text>
<rect class="panel" x="70" y="150" width="700" height="340" rx="34"/>
<text class="t" x="110" y="205" font-size="25" font-weight="650">A. Collapsed notification stack</text>
<text class="m" x="110" y="238" font-size="17">The stack itself communicates accumulated attention. No screaming red badge.</text>
<rect class="card" x="195" y="346" width="450" height="82" rx="22" opacity=".60"/>
<rect class="card" x="180" y="330" width="480" height="90" rx="22" opacity=".78"/>
<rect class="card" x="165" y="300" width="510" height="102" rx="22"/>
<circle cx="205" cy="338" r="14" fill="#181818"/>
<text class="t" x="235" y="334" font-size="18" font-weight="650">Approval required</text>
<text class="m" x="235" y="363" font-size="16">Campaign draft waiting</text>
<rect class="dark" x="610" y="185" width="104" height="42" rx="21"/>
<text x="632" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="white">3 items</text>
<rect class="panel" x="830" y="150" width="700" height="610" rx="34"/>
<text class="t" x="870" y="205" font-size="25" font-weight="650">B. Expanded center</text>
<text class="m" x="870" y="238" font-size="17">Priority sorted, direct actions, one coherent visual system.</text>
<rect class="card" x="900" y="280" width="560" height="130" rx="22"/>
<circle cx="940" cy="320" r="10" fill="#181818"/>
<text class="t" x="968" y="318" font-size="18" font-weight="650">Checkout needs attention</text>
<text class="m" x="968" y="347" font-size="15">3 failed attempts · 2m</text>
<rect class="soft" x="968" y="365" width="78" height="30" rx="15"/><text class="t" x="993" y="386" font-size="14">View</text>
<rect class="dark" x="1058" y="365" width="84" height="30" rx="15"/><text x="1084" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="white">Retry</text>
<rect class="card" x="900" y="428" width="560" height="130" rx="22"/>
<circle cx="940" cy="468" r="10" fill="#181818"/>
<text class="t" x="968" y="466" font-size="18" font-weight="650">Approval required</text>
<text class="m" x="968" y="495" font-size="15">Campaign draft waiting · 6m</text>
<rect class="soft" x="968" y="513" width="92" height="30" rx="15"/><text class="t" x="989" y="534" font-size="14">Review</text>
<rect class="dark" x="1072" y="513" width="96" height="30" rx="15"/><text x="1093" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="white">Approve</text>
<rect class="card" x="900" y="576" width="560" height="112" rx="22"/>
<circle cx="940" cy="616" r="10" fill="#666"/>
<text class="t" x="968" y="614" font-size="18" font-weight="650">Agent task completed</text>
<text class="m" x="968" y="643" font-size="15">Pricing audit finished · 11m</text>
<text class="t" x="1337" y="645" font-size="14">Open →</text>
<rect class="panel" x="70" y="545" width="700" height="390" rx="34"/>
<text class="t" x="110" y="600" font-size="25" font-weight="650">C. Rafii Live Pill</text>
<text class="m" x="110" y="633" font-size="17">Real task state morphs. Active work does not automatically become a durable notification.</text>
<rect class="dark" x="130" y="690" width="195" height="48" rx="24"/>
<circle cx="158" cy="714" r="6" fill="#ddd"/><text x="178" y="720" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="white">Rafii · Working…</text>
<text class="m" x="350" y="721" font-size="26">→</text>
<rect class="dark" x="390" y="682" width="315" height="64" rx="32"/>
<circle cx="420" cy="714" r="7" fill="#ddd"/><text x="442" y="710" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="white">Analyzing 14 campaigns</text><text x="442" y="732" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#bcbcbc">real progress only</text>
<text class="m" x="350" y="806" font-size="26">→</text>
<rect x="390" y="770" width="260" height="64" rx="32" fill="#fff" stroke="#181818" stroke-width="2"/><circle cx="420" cy="802" r="9" fill="#181818"/>
<text class="t" x="444" y="798" font-size="16" font-weight="650">Needs your input</text><text class="m" x="444" y="820" font-size="13">Promote to durable card</text>
<text class="m" x="130" y="884" font-size="16">Success: brief completion → toast/activity history. Error: View/Retry only when valid.</text>
<text class="m" x="1160" y="830" font-size="15">Hover/focus on desktop</text><text class="m" x="1160" y="855" font-size="15">Tap on mobile</text><text class="m" x="1160" y="880" font-size="15">Escape to collapse</text><text class="m" x="1160" y="905" font-size="15">Reduced-motion path required</text>
</svg>
