<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f5f5f2"/>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#161616}.m{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666}.box{fill:#fff;stroke:#d8d8d3;stroke-width:2}.dark{fill:#181818}</style>
<text class="t" x="70" y="75" font-size="34" font-weight="700">Rafii notification surface routing</text>
<text class="m" x="70" y="112" font-size="19">One event model, four deliberately different presentation surfaces</text>
<rect class="box" x="90" y="190" width="330" height="135" rx="28"/><text class="t" x="125" y="235" font-size="21" font-weight="650">Active agent/task state</text><text class="m" x="125" y="270" font-size="16">running • progress • waiting</text><text class="m" x="125" y="296" font-size="16">success • error</text>
<rect class="box" x="90" y="385" width="330" height="135" rx="28"/><text class="t" x="125" y="430" font-size="21" font-weight="650">Durable notification event</text><text class="m" x="125" y="465" font-size="16">attention • security • billing</text><text class="m" x="125" y="491" font-size="16">warning • approval • reconnect</text>
<rect class="box" x="90" y="580" width="330" height="135" rx="28"/><text class="t" x="125" y="625" font-size="21" font-weight="650">Local UI result</text><text class="m" x="125" y="660" font-size="16">copied • saved • sent</text><text class="m" x="125" y="686" font-size="16">mutation success/error</text>
<rect class="dark" x="600" y="330" width="400" height="190" rx="36"/><text x="690" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="white" font-weight="650">Presentation router</text><text x="650" y="425" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#ccc">stable identity • priority • durability</text><text x="650" y="455" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#ccc">safe actions • real runtime state</text><text x="650" y="485" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#ccc">no fuzzy dedupe</text>
<path d="M420 258 C520 258 520 375 600 390" fill="none" stroke="#777" stroke-width="3"/><path d="M420 452 C510 452 520 430 600 430" fill="none" stroke="#777" stroke-width="3"/><path d="M420 648 C520 648 520 505 600 475" fill="none" stroke="#777" stroke-width="3"/>
<rect class="box" x="1170" y="155" width="340" height="120" rx="26"/><text class="t" x="1210" y="200" font-size="21" font-weight="650">Live Pill</text><text class="m" x="1210" y="234" font-size="16">What Rafii is doing now</text>
<rect class="box" x="1170" y="315" width="340" height="120" rx="26"/><text class="t" x="1210" y="360" font-size="21" font-weight="650">Notification Center</text><text class="m" x="1210" y="394" font-size="16">What needs attention</text>
<rect class="box" x="1170" y="475" width="340" height="120" rx="26"/><text class="t" x="1210" y="520" font-size="21" font-weight="650">Toast</text><text class="m" x="1210" y="554" font-size="16">Did my last action work?</text>
<rect class="box" x="1170" y="635" width="340" height="120" rx="26"/><text class="t" x="1210" y="680" font-size="21" font-weight="650">Activity Feed</text><text class="m" x="1210" y="714" font-size="16">What happened earlier</text>
<path d="M1000 375 C1080 330 1090 220 1170 215" fill="none" stroke="#777" stroke-width="3"/><path d="M1000 410 C1080 395 1090 375 1170 375" fill="none" stroke="#777" stroke-width="3"/><path d="M1000 450 C1080 480 1090 535 1170 535" fill="none" stroke="#777" stroke-width="3"/><path d="M1000 485 C1080 570 1090 695 1170 695" fill="none" stroke="#777" stroke-width="3"/>
