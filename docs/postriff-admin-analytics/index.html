<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>PostRiff · Admin Analytics 設計示範</title><style>
:root{--bg:#f6f6ef;--paper:#fffef9;--ink:#223e31;--muted:#647264;--line:#dce1d6;--green:#356449;--soft:#eaf0df;--amber:#926118;--amberbg:#fff0cd;--red:#993d34}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b37b2a;outline-offset:3px}.rail{position:fixed;width:224px;inset:0 auto 0 0;border-right:1px solid var(--line);background:#eff1e7;padding:28px 20px;display:flex;flex-direction:column;gap:20px}.brand{font:30px Georgia,serif;font-weight:bold}.sub{font-size:11px;letter-spacing:.12em;color:var(--muted)}nav{display:flex;flex-direction:column;gap:6px}nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:6px}nav button[aria-current=page]{background:#dce7cb;font-weight:650}.rail footer{margin-top:auto;font-size:12px}.rail a{color:var(--green)}main{margin-left:224px;padding:22px 40px 64px;max-width:1560px}.banner{background:var(--amberbg);border-left:4px solid #bc8838;padding:12px 16px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0}.top label{font-size:12px}select{background:var(--paper);border:1px solid #b8c3b4;padding:7px;border-radius:5px;max-width:100%}h1{font:38px/1.2 Georgia,serif;margin:12px 0}h2{font:24px/1.3 Georgia,serif;margin:0 0 12px}h3{margin:0 0 8px;font-size:15px}p{margin:6px 0 16px}.muted{color:var(--muted)}.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.controls label{font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:20px}.card{text-align:left;display:flex;flex-direction:column;align-items:flex-start;min-height:150px}.card strong{font:34px Georgia,serif;margin:6px 0}.card small{color:var(--muted);font-size:11px}.tag{padding:2px 7px;border:1px solid var(--line);border-radius:4px;font-size:11px;display:inline-block}.warn{color:var(--amber);background:var(--amberbg)}.good{background:var(--soft)}.red{color:var(--red)}.columns{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:20px}.panel{margin-top:18px}.columns .panel{margin:0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;letter-spacing:.03em;color:var(--muted)}.tablewrap{overflow:auto}.link{background:none;border:0;text-decoration:underline;color:var(--green);padding:0}.action{border:1px solid var(--line);padding:8px 12px;border-radius:5px;background:var(--soft)}.stack{display:grid;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.barrow{display:grid;grid-template-columns:115px 1fr 50px;gap:10px;align-items:center;margin:15px 0;font-size:12px}.track{height:12px;background:#e8ece1;border-radius:2px}.fill{height:100%;background:#78945f;border-radius:2px}.rule{padding:14px;background:#f2f4eb;border-left:3px solid #78945f;font-size:13px}.chart{width:100%;height:auto}.state{padding:10px 0}.checks{padding-left:20px}.breadcrumb{font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:600px;width:calc(100% - 32px);padding:28px;box-shadow:0 20px 100px #1232}dialog::backdrop{background:#17261b77}dialog dl{display:grid;grid-template-columns:130px 1fr;font-size:13px;gap:8px}dialog dt{color:var(--muted)}dialog dd{margin:0;overflow-wrap:anywhere}.close{float:right;border:1px solid var(--line);background:white;border-radius:4px;padding:5px 10px}.empty{border:1px dashed #bdc8b8;background:#fafbf6;padding:26px;text-align:center;margin-top:18px}.provider{font-weight:650}.caption{font-size:12px;color:var(--muted);margin-top:10px}.foot{margin-top:30px;font-size:12px;color:var(--muted)}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}main{padding:20px}.columns{grid-template-columns:1fr}}@media(max-width:700px){.rail{position:static;width:auto;padding:18px;gap:12px}.rail footer{display:none}nav{flex-direction:row;overflow:auto;white-space:nowrap}nav button{padding:8px}.rail .brand{font-size:25px}main{margin:0;padding:16px}.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px;min-height:135px}.card strong{font-size:27px}h1{font-size:30px}.panel{padding:16px}.barrow{grid-template-columns:90px 1fr 36px}dialog dl{grid-template-columns:1fr}}
</style></head><body><aside class="rail"><div><div class="brand">PostRiff.</div><div class="sub">OPERATIONS & INSIGHTS</div></div><label class="sub">示範視角<br><select id="role" aria-label="示範視角"><option value="owner">James · 產品經營者</option><option value="customer">客戶 · 自己的品牌</option></select></label><nav aria-label="分析導覽" id="nav"></nav><footer>設計候選 v1 · 2026.09.14<br><a href="../superpowers/specs/2026-09-14-postriff-admin-analytics-design.md">完整產品規格 ↗</a><br><a href="ENGINEERING.md">工程與API合約 ↗</a><br><a href="SOURCES.md">平台官方核對 ↗</a><br><a href="DELIVERY.md">驗證與交付收據 ↗</a></footer></aside><main><div class="banner"><b>互動設計示範 · 全部數字為 synthetic</b>　未接入真實客戶、帳號或付款。視角切換只示範版面，正式權限必須由伺服器執行。</div><div class="top"><span class="breadcrumb" id="scope">經營 PostRiff / 第一方營運資料</span><label>資料狀態 <select id="mode"><option value="sample">虛構示範數據</option><option value="empty">尚未接入資料</option></select></label></div><section id="page"></section><p class="foot">此檔案是規格示範，沒有API連線、同步、付款或發布功能。正式版每個數字均須具備來源、時間窗、可見權限和缺值原因。</p></main><dialog id="detail"><button class="close" aria-label="關閉詳情">關閉</button><div id="detailBody"></div></dialog><script>
const $=s=>document.querySelector(s);let tab='overview';const tabs={overview:'經營總覽',social:'品牌社交成效',posts:'內容表現',health:'連接與資料健康',cost:'收入與成本'};
let dataMode=()=>$('#mode').value==='sample';
function card(label,value,note,kind='good',detail=label){return `<button class="card" data-detail="${detail}"><span>${label}</span><strong>${dataMode()?value:'—'}</strong><small>${dataMode()?note:'尚未接入；不是已量到零'}</small><span class="tag ${kind}" style="margin-top:8px">${dataMode()?'SYNTHETIC':'UNAVAILABLE'}</span></button>`}
function controls(platform=false){return `<div class="controls">${platform?'<label>帳號 <select id="platform"><option value="youtube">YouTube · Demo educator</option><option value="instagram">Instagram · 尚未完成資格核實</option><option value="linkedin">LinkedIn · 分析權限待核實</option></select></label>':''}<label>期間 <select id="range"><option value="28">最近28個完整原生日</option><option value="7">最近7個完整原生日</option></select></label><span class="tag">不合併跨平台觀看數</span></div>`}
function series(){const n=Number($('#range')?.value||28), total=n===7?3100:12400;
 const weights=Array.from({length:n},(_,i)=>5+(i*7)%13), sum=weights.reduce((a,b)=>a+b,0);
 const values=weights.map(v=>Math.floor(v*total/sum));values[n-1]+=total-values.reduce((a,b)=>a+b,0);
 return values.map((value,i)=>({date:new Date(Date.UTC(2026,8,8-n+i)).toISOString().slice(0,10),value}));}
function chart(){const rows=series(),max=Math.ceil(Math.max(...rows.map(r=>r.value))/100)*100;
 const points=rows.map((r,i)=>`${45+i*545/(rows.length-1)},${172-r.value/max*140}`).join(' ');
 return `<svg class="chart" viewBox="0 0 650 210" role="img" aria-label="虛構YouTube原生每日views，${rows.length}個完整原生日"><line x1="45" y1="172" x2="628" y2="172" stroke="#cbd3c5"/><line x1="45" y1="32" x2="628" y2="32" stroke="#e1e6d9"/><text x="3" y="36" font-size="11" fill="#647264">${max}</text><text x="16" y="176" font-size="11" fill="#647264">0</text><polyline points="${points}" stroke="#56784c" stroke-width="3" fill="none"/><text x="44" y="197" font-size="11">${rows[0].date}</text><text x="530" y="197" font-size="11">${rows.at(-1).date}</text></svg><details><summary>查看每日數值表（synthetic）</summary><table><thead><tr><th>原生日</th><th>原生 views</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.value}</td></tr>`).join('')}</tbody></table></details>`}

function overview(){return `<div class="kicker">POSTRIFF / BUSINESS OPERATIONS</div><h1>這星期，產品有沒有幫到人？</h1><p class="muted">先看有用內容、回訪與需要處理的阻斷；所有分母可追查。</p><div class="controls"><span class="tag">本週任務：9/07–9/14</span><span class="tag">回訪／留存：各自成熟窗口，截至9/14</span></div><div class="rule"><b>示範待辦：</b>1 個帳號需重新授權 · 2 個試點未滿四週 · 收入資料尚未接入 <button class="link" data-go="health">查看資料健康 →</button></div><div class="cards" style="margin-top:18px">${card('本週有用內容用戶','7 / 10','作者親自判有用；2人assisted')}${card('成熟七日回訪','6 / 8','另有2人觀察窗口未成熟')}${card('四週3週有用','6 / 8','另2人未成熟；未達10人成熟分母')}${card('已核實 MRR','—','付款帳本未接入；不能填0','warn')}</div><div class="columns"><div class="panel"><h2>從素材到願意使用</h2><p class="muted">本週10位合格任務參與者 · 另按激活日計成熟cohort · 虛構演示</p>${[['開始真實任務',10,100],['產出草稿',9,90],['作者判有用',7,70],['完成匯出',6,60]].map(([l,n,w])=>`<div class="barrow"><span>${l}</span><div class="track"><div class="fill" style="width:${dataMode()?w:0}%"></div></div><b>${dataMode()?n:'—'}</b></div>`).join('')}<button class="link" data-detail="分母與窗口">查看分母與排除規則 →</button></div><div class="panel"><h2>本週要作的決定</h2><div class="stack"><div><span class="tag">觀察 · DEMO</span><p>有用內容流程出現2次來源設定阻斷。</p></div><div><span class="tag">候選實驗</span><p>先修來源提示，再觀察下一次任務；不因觀看數高而自動改聲音偏好。</p></div><div class="rule">這裏使用PostRiff自己的產品事件。客戶的YouTube觀看數不進全站總數。</div></div></div></div>`}
function social(){return `<div class="kicker">WORKSPACE / SOCIAL PERFORMANCE</div><h1>看清楚你授權的內容表現。</h1><p class="muted">同一平台、同一帳號、明確時間窗。原生數值與產品事件分開。</p>${controls(true)}<div id="socialBody"></div>`}
function socialBody(){let p=$('#platform')?.value||'youtube',r=$('#range')?.value||'28';if(!dataMode())return `<div class="empty"><h2>尚未接入分析資料</h2><p>完成帳號身份、分析scope與只讀資格核實後，才會開始同步。</p><button class="action" data-go="health">查看連接條件</button></div>`;if(p!=='youtube')return `<div class="empty"><h2>${p==='instagram'?'Instagram：尚待最新Insights資格核實':'LinkedIn：分析scope與app tier待核實'}</h2><p>原生數據：—　狀態：${p==='instagram'?'capability_unqualified':'scope_missing'}</p><p>已連接身份或可發布，都不代表可以讀分析數據。</p><button class="action" data-detail="連接分析">查看只讀接入條件</button></div>`;return `<div class="row"><p class="caption">DEMO channel · America/Los_Angeles 原生日 · 完整至9/07；其後日期未納入此完整期間</p><button class="action" data-detail="同步預覽">預覽同步範圍</button></div><div class="cards">${card('YouTube 原生 views',r==='7'?'3,100':'12,400','provider定義；不與IG／LI相加')}${card('原生觀看分鐘',r==='7'?'4,625':'18,500','未自行轉成內容分數')}${card('原生平均觀看時間','89.5 秒','直接顯示原生report值')}${card('原生新增訂閱',r==='7'?'8':'32','不是跨平台獨立觀眾')}</div><div class="columns"><div class="panel"><h2>原生每日觀看次數</h2>${chart()}<p class="caption">SYNTHETIC 曲線；正式版尾端缺資料不補零，原生日不能改成使用者所在地日界。</p></div><div class="panel"><h2>數據可以怎樣用？</h2><ul class="checks"><li>查看本人授權channel的原生報告。</li><li>按時間窗查看同帳號帖文。</li><li>展開每個值的來源與更新時間。</li></ul><div class="rule">自建YouTube比率、分數和跨擁有人彙總默認停用，需另有政策資格證據。</div><button class="link" data-detail="原生指標定義">查看metric contract →</button></div></div>`}
function posts(){return `<div class="kicker">WORKSPACE / CONTENT PERFORMANCE</div><h1>每一份內容，都可以追返來源。</h1><p class="muted">原生匯入亦可分析。手工填一條連結不代表發布已查證。</p><div class="controls"><span class="tag">固定示範期間：9/01–9/07</span><span class="tag">各平台原生口徑並列</span></div><div class="panel tablewrap"><table><thead><tr><th>內容／來源</th><th>平台</th><th>指標</th><th>口徑</th><th>證據</th></tr></thead><tbody><tr><td><button class="link" data-detail="單帖來源追蹤">Demo：如何整理一個教學觀點</button><br><span class="tag">PostRiff export linked</span></td><td>YouTube</td><td>${dataMode()?'1,200':'—'} views</td><td>原生指定期間</td><td>SYNTHETIC API形狀</td></tr><tr><td>Demo：課堂筆記整理<br><span class="tag">Native imported</span></td><td>LinkedIn</td><td>—</td><td>TOTAL；不假造daily reach</td><td>scope_missing</td></tr><tr><td>Demo：一段知識短帖<br><span class="tag">User reported</span></td><td>Instagram</td><td>—</td><td>metric未qualified</td><td>未查證映射</td></tr></tbody></table></div><div class="rule" style="margin-top:18px">這張表並列三平台，沒有把不同比率合成排行榜；YouTube API原生資料亦不自動進記憶或AI評分。</div>`}
function health(){return `<div class="kicker">CONNECTORS / DATA HEALTH</div><h1>「已連接」要拆開睇。</h1><p class="muted">以下狀態全部是演示，並非你的實際帳號。</p><div class="panel tablewrap"><table><thead><tr><th>帳號</th><th>身份</th><th>分析scope</th><th>只讀查證</th><th>發布</th></tr></thead><tbody><tr><td class="provider">YouTube Demo</td><td>${dataMode()?'DEMO verified':'—'}</td><td>${dataMode()?'DEMO present':'—'}</td><td>${dataMode()?'DEMO fixture':'未接入'}</td><td>此分析模組無發布能力</td></tr><tr><td class="provider">Instagram Demo</td><td>未核實</td><td>exact flow待核實</td><td>unqualified</td><td>獨立資格</td></tr><tr><td class="provider">LinkedIn Demo</td><td>未核實</td><td>r_member_postAnalytics待核實</td><td>app tier未核實</td><td>獨立資格</td></tr></tbody></table></div><div class="columns"><div class="panel"><h2>同步工作狀態</h2><p>queued → running → succeeded／partial／blocked</p><p>429等候；token失效需重新授權；撤權後不保存新返回數據。</p><button class="action" data-detail="同步預覽">查看同步預覽</button></div><div class="panel"><h2>最小權限</h2><p>read worker不能調用publish。管理員亦不能單凭admin身分讀取所有客戶社交數據。</p><button class="link" data-detail="權限邊界">查看權限規格 →</button></div></div>`}
function cost(){return `<div class="kicker">POSTRIFF / UNIT ECONOMICS</div><h1>收入、現金與貢獻分開。</h1><p class="muted">此頁刻意呈現「沒有帳本」，不以漂亮示例MRR代替真實收入。</p><div class="cards">${card('已核實 MRR','—','尚未接入subscription資料','warn')}${card('已收現金','—','需真實payment及refund帳本','warn')}${card('每有用批次成本','—','需包含失敗、分析同步與客服','warn')}${card('完整經營結果','—','客服／創辦人工時未量測','warn')}</div><div class="panel"><h2>成本帳本應包含</h2><div class="tablewrap"><table><thead><tr><th>類別</th><th>來源</th><th>未取得資料時</th></tr></thead><tbody><tr><td>AI／解析／媒體</td><td>operation / attempt / provider結算</td><td>unknown，不填0</td></tr><tr><td>社交API同步</td><td>resource數×實際rate card</td><td>預算未授權，停止paid calls</td></tr><tr><td>客服與獲客</td><td>工時／渠道／cohort</td><td>完整貢獻標incomplete</td></tr><tr><td>固定基建／產品工時</td><td>invoice與工時帳</td><td>不能重複扣為單客成本</td></tr></tbody></table></div></div>`}
function render(){let customer=$('#role').value==='customer';if(customer&&['overview','cost'].includes(tab))tab='social';$('#nav').innerHTML=Object.entries(tabs).filter(([k])=>!customer||!['overview','cost'].includes(k)).map(([k,l])=>`<button data-tab="${k}" aria-current="${k===tab?'page':'false'}">${l}</button>`).join('');$('#scope').textContent=['overview','cost'].includes(tab)?'經營 PostRiff / 第一方營運資料':'品牌分析 / Demo educator 工作區 / 明確帳號授權';$('#page').innerHTML=({overview,social,posts,health,cost}[tab])();if(tab==='social')$('#socialBody').innerHTML=socialBody();}
function detail(name){let text={
'分母與窗口':'本週任務窗口為9/07–9/14。激活cohort按各人activatedAt計算；8人已满28天，2人未滿7天，因此D7及四週成熟分母均為8。四週門檻需至少10人成熟，示範未達。assisted分開，fixture不得進live分析。',
'同步預覽':'候選計画：本人帳號、7個完整原生日、最多12項已qualified metric。預算尚未授權為0，所以沒有外部API呼叫。正式版需planHash、consentEpoch及冪等鍵。',
'權限邊界':'平台owner≠所有客戶workspace成員。社交資料還需要account grant與平台允許；export完成及下載都要重新驗權。此視角切換只是UI示意。',
'連接分析':'需要核實帳號類型、stable ID、最小insights scopes、App審批、token有效性及一次只讀回應。Instagram最新metric／scope合約本轮仍待官方核對。',
'單帖來源追蹤':'Source version → Draft version → Approval hash → PublishIntent/Attempt → verified external ID。Native imported可以沒有PostRiff草稿；手工permalink只能user_reported。'
}[name]||'每個數字保存metric key、原生定義、時間窗、來源及缺值原因。未取得的資料與已量到零分開，不能用示例冒充live。';$('#detailBody').innerHTML=`<div class="kicker">METRIC & EVIDENCE / CANDIDATE</div><h2>${name}</h2><p>${text}</p><dl><dt>資料狀態</dt><dd>synthetic示範，非真實帳號</dd><dt>來源</dt><dd>本HTML內虛構fixture；資料格式見contracts，非同一組數值</dd><dt>可見範圍</dt><dd>${['overview','cost'].includes(tab)?'第一方經營資料：server admin與finance權限':'品牌社交資料：workspace＋account grant'}</dd><dt>平台時間</dt><dd>保留原生period timezone</dd><dt>缺值規則</dt><dd>null＋reason，不使用0代替</dd><dt>實際執行</dt><dd>無API、無付款、無發布</dd></dl>`;$('#detail').showModal()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab],[data-go],[data-detail]');if(!t)return;if(t.dataset.tab||t.dataset.go){tab=t.dataset.tab||t.dataset.go;render()}else detail(t.dataset.detail)});$('#role').addEventListener('change',render);$('#mode').addEventListener('change',render);document.addEventListener('change',e=>{if(tab==='social'&&['platform','range'].includes(e.target.id))$('#socialBody').innerHTML=socialBody()});$('.close').addEventListener('click',()=>$('#detail').close());render();
</script></body></html>
