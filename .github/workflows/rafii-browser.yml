name: Rafii browser scenes
# Real-input Playwright scenes for Home, Automations, the site agent panel, the Rafii live agent (style, / commands,
# voice) and its guides against the local dev harness (disposable PostgreSQL, synthetic providers, research off).
# Drafting uses the fixture writer only; nothing is scheduled or published and no external network is reached from the
# pages under test (voice, the agent's reasoning and the weather use the agent QA harness's stand-ins).
on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/postriff_phase2/**'
      - 'scripts/postriff_dev_hosted.py'
      - '.github/workflows/rafii-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rafii-browser-${{ github.ref }}
  cancel-in-progress: true
env:
  # @openuidev/lang-core sends install telemetry from postinstall unless disabled (rafii-genui/1, G14).
  OPENUI_TELEMETRY_DISABLED: '1'
jobs:
  scenes:
    runs-on: ubuntu-24.04
    # 60: the live agent's voice scenes add a development build that compiles its pages on first visit.
    timeout-minutes: 60
    env:
      PYTHONPATH: src:tests
      POSTRIFF_RESEARCH: '0'
      POSTRIFF_LOCAL_CLI: '0'
      POSTRIFF_PG_BIN: /usr/lib/postgresql/17/bin
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SENTRY_DISABLED: '1'
      # consumer_ready_web.py builds and serves the web app on 4439 against an API on 4438.
      RAFII_WEB_URL: http://127.0.0.1:4439
      RAFII_API_URL: http://127.0.0.1:4438
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned application and test tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm install -g npm@11.12.1
          npm --prefix web ci
      - name: Install PostgreSQL 17 using its signed official repository
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
          # The scripts start their own disposable server; its socket directory must be writable by the runner.
          sudo mkdir -p /var/run/postgresql && sudo chmod 1777 /var/run/postgresql
      - name: Build the web app for the local harness
        run: |
          python scripts/consumer_ready_web.py --prepare npm ci
          python scripts/consumer_ready_web.py npm run build
      - name: Start the dev harness and the web app
        run: |
          POSTRIFF_DEV_WEB_ORIGIN=http://127.0.0.1:4439 nohup python scripts/postriff_dev_hosted.py --port 4438 --pg-port 55479 > harness.log 2>&1 &
          nohup python scripts/consumer_ready_web.py npm run start -- -p 4439 -H 127.0.0.1 > web.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:4438/api/health > /dev/null && curl -sf -o /dev/null http://127.0.0.1:4439/; then echo ready; exit 0; fi
            sleep 2
          done
          echo "harness or web app did not start"; tail -n 50 harness.log web.log; cat /tmp/postriff-dev-pg-*/postgres.log 2>/dev/null | tail -n 20; exit 1
      - name: Install Chromium for Playwright
        run: npx --prefix web playwright install --with-deps chromium
      - name: Seed the synthetic workspace
        run: node web/tests/rafii-seed.cjs
      - name: Automations scenes (build, edit, activate, pause, resume, cancel, templates, phone)
        # --no-run skips waiting for a scheduled minute; the worker run itself is covered by
        # tests/phase2/postgres_consumer_campaign_worker.py in the release gates.
        run: node web/tests/rafii-automations.cjs --no-run
      - name: Home scenes (drafting with the fixture writer, Content Library, Queue → Drafts)
        run: node web/tests/rafii-workflow.cjs --only=workflow,library,drafts
      - name: Chat attachments (＋ menu, Library, photo and MP4 uploads, @ list with IME, Used this time, phone sheet)
        run: node web/tests/rafii-attachments.cjs
      - name: Theme bars (header and phone tab bar match light and dark under any stored theme)
        run: node web/tests/rafii-theme-bars.cjs
      - name: UI simplification (first-run empty states own one action; shared connection status words)
        run: node web/tests/ui-simplification-browser.cjs
      - name: Home with a synthetic API (composer, Writing Voice, Automations link, suggestions)
        run: node web/tests/raffi-browser.mjs
      - name: Site agent journey, Chromium (panel on every page, grounded answers, proposals, voice check, compound request, help, tablet, phone, axe)
        run: node web/tests/site-agent-browser.cjs --browser=chromium --out=docs/design/site-agent/evidence/ci-browser-chromium
      - name: Start a voice harness and a development build for the live agent's voice scenes
        # Voice needs two things the scenes' own servers leave off, so those stay exactly as the other scenes expect:
        # the agent runtime's local QA harness (RAFII_AGENT_HARNESS=1: scripted Manager, GPT-Live session and Open-Meteo
        # stand-ins; refused on Vercel) and the scriptable in-page GPT-Live transport, which only development builds
        # contain (web/src/lib/agent-runtime/live-transport.ts, createTransport). --phone-fixture adds fake-only phone
        # verification and call delivery for the request-call scene. Nothing here reaches a provider.
        # A failed voice backend is a startup failure; do not run weather against a dead proxy target.
        run: |
          RAFII_AGENT_HARNESS=1 POSTRIFF_DEV_WEB_ORIGIN=http://127.0.0.1:4441 nohup python scripts/postriff_dev_hosted.py --port 4440 --pg-port 55480 --phone-fixture > voice-harness.log 2>&1 &
          voice_pid=$!
          preserve_voice_startup() {
            tail -n 160 voice-harness.log voice-web.log
            mkdir -p docs/design/rafii-live-agent/evidence/ci-startup
            for pg_log in /tmp/postriff-dev-pg-*/postgres.log; do
              if [ -f "$pg_log" ]; then
                cp "$pg_log" "docs/design/rafii-live-agent/evidence/ci-startup/$(basename "$(dirname "$pg_log")").log"
              fi
            done
          }
          (cd web && POSTRIFF_API_ORIGIN=http://127.0.0.1:4440 POSTRIFF_DEV_SSR=1 NEXT_PUBLIC_APP_URL=http://127.0.0.1:4441 NEXT_PUBLIC_SUPABASE_URL= NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY= nohup npx next dev -p 4441 -H 127.0.0.1 > ../voice-web.log 2>&1 &)
          for i in $(seq 1 150); do
            if ! kill -0 "$voice_pid" 2>/dev/null; then
              echo "voice harness exited before readiness"
              preserve_voice_startup
              exit 1
            fi
            if curl -sf http://127.0.0.1:4440/api/health > /dev/null && curl -s -o /dev/null --max-time 120 http://127.0.0.1:4441/; then
              # Compile the app shell and the scenes' page once, so the first scene does not wait for it.
              curl -s -o /dev/null --max-time 300 -b 'postriff_dev=1' http://127.0.0.1:4441/app/calendar || true
              echo ready; exit 0
            fi
            sleep 2
          done
          echo "voice harness or development web server did not start"
          preserve_voice_startup
          exit 1
      - name: Rafii style, commands and weather, Chromium
        env:
          # Weather uses the development build and synthetic voice harness; style and commands use the main build.
          RAFII_VOICE_WEB_URL: http://127.0.0.1:4441
          RAFII_VOICE_PG_PORT: '55480'
        run: node web/tests/rafii-live-agent-browser.cjs --browser=chromium --sections=style,style-phone,slash,slash-phone,weather --out=docs/design/rafii-live-agent/evidence/ci-browser-chromium
      - name: Rafii Agent Chat and Meshy Live, Chromium
        env:
          RAFII_WEB_URL: http://127.0.0.1:4441
          RAFII_VOICE_PG_PORT: '55480'
        run: node web/tests/rafii-chat-concepts-browser.cjs --browser=chromium --out=docs/design/rafii-agent-chat-redesign/evidence/ci-browser-chromium
      - name: Rafii phone requests, Chromium (fake calls only)
        # This scene creates its own dev principal/workspace and refuses a real phone transport before verification or dialing.
        shell: bash
        env:
          RAFII_WEB_URL: http://127.0.0.1:4441
          RAFII_HARNESS_PG_PORT: '55480'
          RAFII_PYTHON: python3
          RAFII_PHONE_BROWSER_EVIDENCE_DIR: docs/design/rafii-live-agent/evidence/ci-phone-chromium
        run: |
          mkdir -p "$RAFII_PHONE_BROWSER_EVIDENCE_DIR"
          node web/tests/phone-mode-browser.cjs 2>&1 | tee "$RAFII_PHONE_BROWSER_EVIDENCE_DIR/phone-mode.log"
      - name: Rafii guide, Chromium (/guide connect opens Channels, cursor and ring, Next and Stop, only data-guide-safe clicks, stops at Continue, Escape, phone)
        run: node web/tests/rafii-guide-browser.cjs --browser=chromium --out=docs/design/rafii-live-agent/evidence/ci-guide-chromium
      - name: Install WebKit for Playwright
        # Linux WebKit: the pinned Playwright's macOS WebKit build needs macOS 15.4 or later.
        run: npx --prefix web playwright install --with-deps webkit
      - name: Site agent journey, WebKit (the same checks)
        run: node web/tests/site-agent-browser.cjs --browser=webkit --out=docs/design/site-agent/evidence/ci-browser-webkit
      - name: Rafii style, commands and weather, WebKit
        env:
          RAFII_VOICE_WEB_URL: http://127.0.0.1:4441
          RAFII_VOICE_PG_PORT: '55480'
        run: node web/tests/rafii-live-agent-browser.cjs --browser=webkit --sections=style,style-phone,slash,slash-phone,weather --out=docs/design/rafii-live-agent/evidence/ci-browser-webkit
      - name: Rafii Agent Chat and Meshy Live, WebKit
        env:
          RAFII_WEB_URL: http://127.0.0.1:4441
          RAFII_VOICE_PG_PORT: '55480'
        run: node web/tests/rafii-chat-concepts-browser.cjs --browser=webkit --out=docs/design/rafii-agent-chat-redesign/evidence/ci-browser-webkit
      - name: Rafii guide, WebKit (safe guide clicks, stop, Escape and phone)
        run: node web/tests/rafii-guide-browser.cjs --browser=webkit --out=docs/design/rafii-live-agent/evidence/ci-guide-webkit
      - name: Keep the evidence for this commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rafii-browser-${{ github.sha }}
          path: |
            docs/design/rafii-v9/evidence/automations/
            docs/design/rafii-v9/evidence/workflow/
            docs/design/rafii-v9/evidence/attachments/
            docs/design/rafii-v9/evidence/theme-bars/
            docs/design/site-agent/evidence/ci-browser-chromium/
            docs/design/site-agent/evidence/ci-browser-webkit/
            docs/design/rafii-live-agent/evidence/ci-startup/
            docs/design/rafii-live-agent/evidence/ci-browser-chromium/
            docs/design/rafii-live-agent/evidence/ci-thinkingops-chromium/
            docs/design/rafii-live-agent/evidence/ci-guide-chromium/
            docs/design/rafii-live-agent/evidence/ci-browser-webkit/
            docs/design/rafii-live-agent/evidence/ci-guide-webkit/
            docs/design/rafii-live-agent/evidence/ci-phone-chromium/
            harness.log
            web.log
            voice-harness.log
            voice-web.log
          retention-days: 14
