name: Universal Library release validation
on:
  pull_request:
    branches: [consumer-saas]
    paths:
      - 'src/postriff_phase2/**'
      - 'web/**'
      - 'tests/**'
      - 'migrations/postriff/**'
      - 'scripts/*library*'
      - 'runtime/**'
      - 'requirements*.txt'
      - 'vercel.json'
      - '.github/workflows/library-release.yml'
  workflow_dispatch:
    inputs:
      prepare_dependency_lock:
        description: Prepare reviewed security lock updates as an artifact; never commit or deploy
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: library-release-${{ github.ref }}-${{ inputs.prepare_dependency_lock || false }}
  cancel-in-progress: true
env:
  # @openuidev/lang-core sends install telemetry from postinstall unless disabled (rafii-genui/1, G14).
  OPENUI_TELEMETRY_DISABLED: '1'
jobs:
  library:
    if: ${{ inputs.prepare_dependency_lock != true }}
    runs-on: ubuntu-24.04
    # Cold-run apt setup consumed over 30 minutes before browser acceptance.
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:4439
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
      NEXT_PUBLIC_SENTRY_DISABLED: '1'
      POSTRIFF_API_ORIGIN: http://127.0.0.1:4438
      POSTRIFF_DEV_SSR: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run ci:library
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: universal-library-${{ github.sha }}
          path: |
            docs/consumer-ready/evidence/library/
            .codex/library-samples/
          include-hidden-files: true
          retention-days: 14
  document-runtime:
    if: ${{ inputs.prepare_dependency_lock != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Both images come from AWS's own ECR Public publisher, pinned by multi-arch
      # index digest so every run uses the same bytes. Refresh deliberately (for
      # example monthly or for an AL2023/Lambda security update): resolve the new
      # index digest, confirm the amd64 manifest, and re-run this job. Never float.
      # Resolved 2026-10-09 through the anonymous ECR Public registry API:
      #   amazonlinux:2023 -> amd64 manifest sha256:3552faf41b70d5b123fc33d4429a259baa2bcf9aa6ab15c70ad6da40fd63d247,
      #     one rootfs layer sha256:7234d0a9b6ba1270c7bb653ee62a443a1dbb6fdfa833336edd3c0691c2524d1f, built 2026-09-29
      #   lambda/python:3.12 -> amd64 manifest sha256:9531d39617b0966d2238cd30328087d53803110d50948feca99d29437422cffa, built 2026-10-09
      BUILDER_IMAGE: public.ecr.aws/amazonlinux/amazonlinux:2023@sha256:12052e9b5d3fd85769abbdd863dd038e1890c9ace31d5fdbe1afa78eda97d061
      LAMBDA_IMAGE: public.ecr.aws/lambda/python:3.12@sha256:145350008f3f67d82c0bc6ecd34d9eb0c95aecf11f9b69db6bab7de3d5d3cc61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pull the pinned images and record their digests
        run: |
          for image in "$BUILDER_IMAGE" "$LAMBDA_IMAGE"; do
            docker pull --platform linux/amd64 "$image"
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            echo "image=$image platform=$platform repoDigests=$(docker image inspect --format '{{join .RepoDigests ","}}' "$image")"
            test "$platform" = linux/amd64
          done
          docker run --rm --pull=never --entrypoint /var/lang/bin/python3.12 "$LAMBDA_IMAGE" -c \
            'import sys; print("lambda python", sys.version); assert sys.version_info[:2] == (3, 12)'
      - name: Build and exercise the real Amazon Linux document bundle
        run: |
          # AWS publishes this same AL2023 base on ECR; avoid the unrelated Docker Hub token endpoint.
          docker run --rm --pull=never -v "$GITHUB_WORKSPACE:/work" -w /work "$BUILDER_IMAGE" bash -euc '
            dnf install -y python3.12 python3.12-pip tar gzip findutils which
            python3.12 runtime/build_document_renderer.py
            python3.12 -m pip install --target .document-test-python Pillow==12.3.0 pypdfium2==5.14.0 Markdown==3.11
            PYTHONPATH=src:tests:.document-test-python python3.12 -m unittest test_library_preview
            du -sh .document-runtime
          '
      - name: Exercise only the bundled runtime in a clean read-only Lambda image
        run: |
          # The builder has every Office RPM installed. A second pristine image
          # catches missing dynamically opened libraries and system-tool reliance.
          docker run --rm --pull=never --read-only --user 1000:1000 --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp:rw,size=536870912,mode=1777 \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            -e PYTHONPATH=/work/src:/work/tests:/work/.document-test-python \
            --entrypoint /var/lang/bin/python3.12 "$LAMBDA_IMAGE" \
            -m unittest test_library_preview
  dependency-lock:
    if: ${{ inputs.prepare_dependency_lock == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - working-directory: web
        run: |
          npm pkg set 'dependencies.sharp=^0.35.5' 'overrides.sharp=^0.35.5' 'overrides.tinypool=2.1.2' 'overrides.source-map-js=1.2.2'
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
          git diff --stat -- package.json package-lock.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: library-security-lock-${{ github.sha }}
          path: |
            web/package.json
            web/package-lock.json
          retention-days: 3
