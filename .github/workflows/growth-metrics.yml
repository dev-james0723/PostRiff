name: Growth metrics acceptance
on:
  pull_request:
    paths:
      - 'src/postriff_phase2/**'
      - 'tests/test_growth_metric_schedule.py'
      - 'tests/test_trend_learning.py'
      - 'tests/phase2/postgres_growth_*.py'
      - 'scripts/trend_browser.py'
      - 'scripts/trend_strategy_browser.py'
      - 'scripts/trend_learning_portable.py'
      - 'web/tests/trend-live-api-browser.cjs'
      - '.github/workflows/growth-metrics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: growth-metrics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-learning-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src:tests
      POSTRIFF_RESEARCH: '0'
      POSTRIFF_LOCAL_CLI: '0'
      POSTRIFF_PG_BIN: /usr/lib/postgresql/17/bin
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SENTRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned application and validation tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm install -g npm@11.12.1
          npm --prefix web ci
      - name: Install PostgreSQL 17 from its signed repository
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
          sudo mkdir -p /var/run/postgresql && sudo chmod 1777 /var/run/postgresql
      - name: Native metric schedule and disconnect rights (synthetic transport)
        run: python scripts/postriff_pg_suite.py postgres_growth_metric_reads postgres_growth_history
      - name: Account, definition and 24h cohort SQL (socket-only, no providers)
        run: python scripts/trend_learning_portable.py
      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Real browser, API and DB admission and metric-choice proof
        run: python scripts/trend_browser.py --learning-only --metric-admission --out docs/consumer-ready/evidence/growth-metrics/learning
      - name: Real browser, API and DB owner review, expiry and strategy proof
        run: python scripts/trend_strategy_browser.py --out docs/consumer-ready/evidence/growth-metrics/strategy
      - name: Retain source-bound synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: growth-metrics-${{ github.sha }}
          path: docs/consumer-ready/evidence/growth-metrics/
          retention-days: 14
