name: X Direct source-bound acceptance
on:
  pull_request:
    paths:
      - 'src/postriff_phase2/**'
      - 'tests/test_x_*.py'
      - 'tests/test_hosted_wave1_connectors.py'
      - 'migrations/postriff/*x*.sql'
      - 'scripts/x_direct_*.py'
      - 'web/src/features/x/**'
      - 'web/src/lib/api/x-types.ts'
      - 'web/tests/x-direct-connected-browser.cjs'
      - '.github/workflows/x-direct-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  x-direct:
    # Standard public-repository runner; no larger runner, cloud build, API key,
    # artifact upload, cache upload, deployment or external publishing step.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENUI_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SENTRY_DISABLED: '1'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      POSTRIFF_RESEARCH: '0'
      POSTRIFF_LOCAL_CLI: '0'
      POSTRIFF_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - name: Fetch exact public source without credentials
        # checkout v7 auth cleanup traverses an existing unrelated orphan gitlink.
        # Do not alter that vendor, persist tokens or initialize submodules.
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dev-james0723/PostRiff' || exit 64
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          test ! -e .git || exit 64
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c credential.helper= -c core.hooksPath=/dev/null init .
          git remote add origin https://github.com/dev-james0723/PostRiff.git
          git -c credential.helper= -c http.extraHeader= -c submodule.recurse=false fetch --no-tags --no-recurse-submodules --depth=1 origin "$EXPECTED_SHA"
          git -c core.hooksPath=/dev/null -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 65
          test -z "$(git config --local --get-regexp 'credential\.|extraheader|includeIf' || true)" || exit 65
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-x-tests.txt
          npm install -g npm@11.12.1
          npm --prefix web ci
      - name: Install local PostgreSQL and matching browser binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 ffmpeg
          cd web
          node node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: X SQL, all web contracts, lint, build, types and connected desktop/mobile
        run: python scripts/x_direct_acceptance.py --output "$RUNNER_TEMP/x-direct-evidence"
      - name: Commit-bound result (logs only, no artifact storage)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'x-direct-evidence' / 'result.json'
          text = path.read_text() if path.exists() else '{"status":"NOT_RUN","publicReady":false}'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## X Direct — synthetic-provider acceptance\n\nThis is not real X customer acceptance or a production release.\n\n```json\n' + text + '\n```\n')
          PY
