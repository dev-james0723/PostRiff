name: James Au Studio Companion
options:
  deploymentTarget:
    iOS: 18.0
settings:
  base:
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

schemes:
  James Au Studio Companion:
    shared: true
    build:
      targets:
        James Au Studio Companion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - James Au Studio CompanionTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  James Au Studio Companion:
    type: application
    platform: iOS
    bundleId: com.jamesau.studio.companion
    sources:
      - path: Sources
        type: syncedFolder
    resources:
      - Resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesau.studio.companion
        PRODUCT_MODULE_NAME: JamesAuStudioCompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies: []

  James Au Studio CompanionTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.jamesau.studio.companion.Tests
    sources:
      - path: Tests
        type: syncedFolder
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesau.studio.companion.Tests
        PRODUCT_MODULE_NAME: JamesAuStudioCompanionTests
    dependencies:
      - target: James Au Studio Companion
