# Reviewable CI candidate. Not installed into a remote repository or executed.
name: PostRiff unsigned Windows package
on: workflow_dispatch
permissions:
  contents: read
jobs:
  local-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --prefix studio/web
      - run: npm ci --prefix desktop
      - run: python -m pip install pyinstaller==6.22.3 pillow==12.3.0
      - run: python scripts/package_postriff_phase3.py --shell
      - uses: actions/upload-artifact@v4
        with:
          name: PostRiff-Windows-unsigned
          path: desktop/artifacts/PostRiff-win32-x64
