<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img"><title>Editorial illustration: quote. Give a memorable thought room to resonate.</title><defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f3ee"/><stop offset="1" stop-color="#e2e3dc"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#20231b" flood-opacity=".13"/></filter></defs><rect x="0" y="0" width="320" height="200" rx="0" fill="url(#paper)" stroke="none" stroke-width="1"/><g style="filter:grayscale(1)"><g transform="rotate(-3 160 100)"><g transform="rotate(0 160.0 100.0)" filter="url(#shadow)"><rect x="68" y="28" width="184" height="144" rx="7" fill="#fff" stroke="none" stroke-width="1"/></g><g transform="translate(91 50) scale(1)"><path d="M0 12Q0 0 10 0V7H6V12H11V23H0ZM16 12Q16 0 26 0V7H22V12H27V23H16Z" fill="#393b35" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="91" y="107" font-family="Georgia,serif" font-size="17" font-weight="400" fill="#343531" text-anchor="start">A thought worth</text><text x="91" y="131" font-family="Georgia,serif" font-size="17" font-weight="400" fill="#343531" text-anchor="start">holding on to.</text><path d="M92 151H126" stroke="#777" stroke-width="2" stroke-linecap="round"/><circle cx="235" cy="39" r="4" fill="#898b81" stroke="none" stroke-width="2"/></g></g></svg>